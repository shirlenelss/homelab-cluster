apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkding-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /var/lib/rancher/k3s/storage/linkding-data
    type: DirectoryOrCreate
