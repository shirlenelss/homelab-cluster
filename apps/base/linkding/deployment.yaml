apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: linkding
  template:
    metadata:
      labels: 
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          ports: 
            - containerPort: 9090
          volumeMounts:       
            - name: linkding-data
              mountPath: /data  # where Linkding stores its data 
      securityContext:         
        runAsNonRoot: true
        runAsUser: 1000
        runAsUser: 1000
        runAsGroup: 1000       
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data