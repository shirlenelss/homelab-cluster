apiVersion: v1
kind: ConfigMap
metadata:
  name: audiobookshelf-config
  namespace: audiobookshelf
data:
  # Must be absolute - these match the actual PVC mount paths in
  # deployment.yaml. A relative path here would point the app at an
  # ephemeral directory instead of the mounted PVCs.
  CONFIG_PATH: /config
  METADATA_PATH: /metadata
  PORT: "3005"
  TZ: Europe/Stockholm
