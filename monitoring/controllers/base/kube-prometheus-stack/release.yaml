apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: monitoring
spec:
    interval: 30m
    chart:
        spec:
            chart: kube-prometheus-stack
            version: 66.2.2
            sourceRef:
                kind: HelmRepository
                name: kube-prometheus-stack
                namespace: monitoring
            interval: 12h
    install:
        crds: Create
    upgrade:
        crds: CreateReplace
    driftDetection:
        mode: enabled
        ignore:
            # Ignore "validated" annotation which is not inserted during install
            - paths:
                - /metadata/annotations/prometheus-operator-validated
              target:
                kind: PrometheusRule
    values:
        grafana:
            adminPassword: ENC[AES256_GCM,data:PYWovvgAa9MIMg==,iv:d/0sGzexSX6yizi4MClD5PhHsOalUn2I4mGZ1JpLZvA=,tag:JPljzF9jIBU2800o0NGcvg==,type:str]
            ingress:
                enabled: true
                ingressClassName: traefik
                hosts:
                    - grafana.shirlenelim.se
                path: /
                pathType: Prefix
                ## TLS configuration for grafana Ingress
                ## Secret must be manually created in the namespace
                ##
                tls:
                    - secretName: grafana-tls-secret
                      hosts:
                        - grafana.shirlenelim.se
        prometheus:
            prometheusSpec:
                ## Honors the prometheus.io/scrape, prometheus.io/path and prometheus.io/port
                ## pod annotations, since not every workload ships a ServiceMonitor/PodMonitor.
                additionalScrapeConfigs:
                    - job_name: kubernetes-pods
                      kubernetes_sd_configs:
                        - role: pod
                      relabel_configs:
                        - source_labels:
                            - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                          action: keep
                          regex: true
                        - source_labels:
                            - __meta_kubernetes_pod_annotation_prometheus_io_path
                          action: replace
                          target_label: __metrics_path__
                          regex: (.+)
                        - source_labels:
                            - __address__
                            - __meta_kubernetes_pod_annotation_prometheus_io_port
                          action: replace
                          regex: ([^:]+)(?::\d+)?;(\d+)
                          replacement: $1:$2
                          target_label: __address__
                        - action: labelmap
                          regex: __meta_kubernetes_pod_label_(.+)
                        - source_labels:
                            - __meta_kubernetes_namespace
                          action: replace
                          target_label: kubernetes_namespace
                        - source_labels:
                            - __meta_kubernetes_pod_name
                          action: replace
                          target_label: kubernetes_pod_name
