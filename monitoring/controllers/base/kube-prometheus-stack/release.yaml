apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: monitoring
spec:
    interval: 30m
    chart:
        spec:
            chart: kube-prometheus-stack
            version: 66.2.2
            sourceRef:
                kind: HelmRepository
                name: kube-prometheus-stack
                namespace: monitoring
            interval: 12h
    install:
        crds: Create
    upgrade:
        crds: CreateReplace
    driftDetection:
        mode: enabled
        ignore:
            # Ignore "validated" annotation which is not inserted during install
            - paths:
                - /metadata/annotations/prometheus-operator-validated
              target:
                kind: PrometheusRule
    values:
        grafana:
            adminPassword: ENC[AES256_GCM,data:t0Cu6IDwi5NDtQ==,iv:QAGGNM+mp2Zq01MN0TCC0ywETOlV+fYD7lkViOSTKMw=,tag:8qWQGJXSojxPQ8Rd5PaWNw==,type:str]
            ## Without this, /var/lib/grafana (sqlite db) is an ephemeral
            ## volume - any pod restart silently wipes the Public Dashboard
            ## toggle (stored in the db, not in dashboard JSON) and any
            ## other UI-only state (API keys, alert silences).
            persistence:
                enabled: true
                type: sts
                storageClassName: local-path-retain
                accessModes:
                    - ReadWriteOnce
                size: 1Gi
            ingress:
                enabled: true
                ingressClassName: traefik
                annotations:
                    # cert-manager watches ingresses for this annotation and
                    # auto-provisions/renews a cert into tls[0].secretName below
                    # via the letsencrypt-prod ClusterIssuer (DNS-01/Cloudflare).
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                    - grafana.shirlenelim.se
                path: /
                pathType: Prefix
                ## TLS configuration for grafana Ingress.
                ## secretName is managed by cert-manager, not manually created -
                ## do not point this at the old hand-provisioned grafana-tls-secret.
                tls:
                    - secretName: grafana-tls-letsencrypt
                      hosts:
                        - grafana.shirlenelim.se
        prometheus:
            prometheusSpec:
                ## Attached to every series scraped by this Prometheus - lets you
                ## tell metrics from this cluster apart from others in Grafana/queries
                ## without having to reference this cluster's node IP.
                externalLabels:
                    cluster: homelab
                ## Honors the prometheus.io/scrape, prometheus.io/path and prometheus.io/port
                ## pod annotations, since not every workload ships a ServiceMonitor/PodMonitor.
                additionalScrapeConfigs:
                    - job_name: kubernetes-pods
                      kubernetes_sd_configs:
                        - role: pod
                      relabel_configs:
                        - source_labels:
                            - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                          action: keep
                          regex: true
                        - source_labels:
                            - __meta_kubernetes_pod_annotation_prometheus_io_path
                          action: replace
                          target_label: __metrics_path__
                          regex: (.+)
                        - source_labels:
                            - __address__
                            - __meta_kubernetes_pod_annotation_prometheus_io_port
                          action: replace
                          regex: ([^:]+)(?::\d+)?;(\d+)
                          replacement: $1:$2
                          target_label: __address__
                        - action: labelmap
                          regex: __meta_kubernetes_pod_label_(.+)
                        - source_labels:
                            - __meta_kubernetes_namespace
                          action: replace
                          target_label: kubernetes_namespace
                        - source_labels:
                            - __meta_kubernetes_pod_name
                          action: replace
                          target_label: kubernetes_pod_name
        prometheus-node-exporter:
            prometheus:
                monitor:
                    ## Replaces the "instance" label (normally IP:port, e.g.
                    ## 192.168.5.15:9100) with the node's hostname, so dashboards/
                    ## queries/dropdowns show something readable instead of an IP.
                    ## Dynamic (not hardcoded) so this still works correctly if a
                    ## second node is ever added - each node keeps its own label.
                    relabelings:
                        - sourceLabels:
                            - __meta_kubernetes_pod_node_name
                          targetLabel: instance
                          action: replace
