apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Points directly at the cert-manager subfolder, not the shared
  # infrastructure/controllers/staging/ aggregator, so unrelated
  # not-yet-deployed work sitting in that aggregator (e.g. renovate)
  # doesn't get pulled in as a side effect.
  path: ./infrastructure/controllers/staging/cert-manager
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
