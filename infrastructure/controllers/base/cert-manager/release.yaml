apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: 1.16.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # Without this, cert-manager's DNS-01 self-check uses the cluster's
    # internal CoreDNS (10.43.0.10), which can't walk up to find the SOA
    # record for an external domain and gets stuck "Waiting for DNS-01
    # challenge propagation" forever. Point it at real public resolvers.
    dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
    dns01RecursiveNameserversOnly: true